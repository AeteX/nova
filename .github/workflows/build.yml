name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type-check and compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

  build:
    name: Release build (Windows)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Clear stale app binary so the icon gets re-embedded
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue src-tauri/target/release/nova.exe
          Remove-Item -Force -ErrorAction SilentlyContinue src-tauri/target/release/nova.pdb
          Get-ChildItem -Path src-tauri/target/release/build -Filter "nova-*" -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Build
        run: npm run tauri build

      - name: Verify icon embedded in exe
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/nova.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "nova.exe was not produced"
            exit 1
          }
          $size = (Get-Item $exe).Length
          $iconPath = "src-tauri/icons/icon.ico"
          $iconSize = (Get-Item $iconPath).Length
          Write-Host "nova.exe size: $([math]::Round($size / 1MB, 2)) MB"
          Write-Host "icon.ico size: $iconSize bytes"
          if ($iconSize -lt 10000) {
            Write-Warning "icon.ico looks suspiciously small ($iconSize bytes) — may not be a proper multi-resolution icon"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn